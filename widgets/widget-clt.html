<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Central Limit Theorem</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Georgia,'Times New Roman',serif;background:#FAFAF8;color:#1A1A1A;padding:16px}
  #app{max-width:780px;margin:0 auto}
  h1{font-size:20px;font-weight:600;margin-bottom:4px}
  .sub{font-size:13px;color:#666;margin-bottom:14px}
  .controls{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-bottom:12px}
  .seg button{font-family:'Courier New',monospace;font-size:12px;padding:5px 10px;border:1px solid #CCC;background:#fff;cursor:pointer;border-radius:4px;margin-right:4px}
  .seg button.on{background:#1A1A1A;color:#fff;border-color:#1A1A1A}
  .ctrl label{font-size:12px;font-family:'Courier New',monospace;color:#444;margin-right:6px}
  .ctrl .val{font-family:'Courier New',monospace;font-size:12px;color:#0b5cab;font-weight:700}
  button.act{font-family:'Courier New',monospace;font-size:12px;padding:5px 12px;border:1px solid #0b5cab;background:#eef4fb;color:#0b5cab;border-radius:4px;cursor:pointer}
  canvas{display:block;width:100%;height:auto;background:#fff;border:1px solid #E5E5E5;border-radius:6px;margin-bottom:10px}
  .readout{font-size:13px;margin-bottom:8px}
  .v{font-weight:700;font-family:'Courier New',monospace;color:#0b5cab}
  .note{font-size:12px;color:#888;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <h1>The Central Limit Theorem</h1>
  <p class="sub">Draw many independent samples of size <i>n</i> from a finite-variance source. The distribution of the <b>sample mean</b> becomes bell-shaped as <i>n</i> grows, even when the source is skewed.</p>

  <div class="controls">
    <div class="seg" id="seg">
      <button data-d="uniform" class="on">Uniform</button>
      <button data-d="exponential">Exponential</button>
      <button data-d="bimodal">Bimodal</button>
    </div>
    <div class="ctrl"><label>n = <span class="val" id="vN">5</span></label><input id="n" type="range" min="1" max="100" step="1" value="5"></div>
    <button class="act" id="resample">Resample</button>
  </div>

  <canvas id="cv" width="700" height="380"></canvas>

  <div class="readout">
    theoretical SE = &sigma;/&radic;n = <span class="v" id="seTh"></span> &nbsp;|&nbsp; observed SD of the means = <span class="v" id="seObs"></span>
  </div>
  <p class="note" id="note"></p>
</div>

<script>
(function(){
  var B=2000;
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var dist='uniform';

  function randn(){ // Box-Muller
    var u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  }
  var SRC={
    uniform:{mu:0.5, sd:Math.sqrt(1/12), lo:0, hi:1,
             draw:function(){return Math.random();},
             pdf:function(x){return (x>=0&&x<=1)?1:0;}, prange:[-0.1,1.1]},
    exponential:{mu:1, sd:1, lo:0, hi:6,
             draw:function(){return -Math.log(1-Math.random());},
             pdf:function(x){return x>=0?Math.exp(-x):0;}, prange:[0,6]},
    bimodal:{mu:0, sd:Math.sqrt(4.25), lo:-5, hi:5,
             draw:function(){return (Math.random()<0.5?-2:2)+0.5*randn();},
             pdf:function(x){var a=Math.exp(-(x+2)*(x+2)/(2*0.25)),b=Math.exp(-(x-2)*(x-2)/(2*0.25));return 0.5*(a+b)/(Math.sqrt(2*Math.PI)*0.5);}, prange:[-5,5]}
  };

  function normPdf(x,mu,sd){return Math.exp(-(x-mu)*(x-mu)/(2*sd*sd))/(sd*Math.sqrt(2*Math.PI));}

  function simulate(n){
    var s=SRC[dist], means=new Array(B);
    for(var i=0;i<B;i++){var acc=0;for(var j=0;j<n;j++)acc+=s.draw();means[i]=acc/n;}
    return means;
  }

  function draw(){
    var n=+document.getElementById('n').value;
    document.getElementById('vN').textContent=n;
    var s=SRC[dist];
    var se=s.sd/Math.sqrt(n);
    var means=simulate(n);

    // observed sd of means
    var m=0; for(var i=0;i<B;i++)m+=means[i]; m/=B;
    var vv=0; for(i=0;i<B;i++)vv+=(means[i]-m)*(means[i]-m); var obs=Math.sqrt(vv/(B-1));

    document.getElementById('seTh').textContent=se.toFixed(3);
    document.getElementById('seObs').textContent=obs.toFixed(3);

    var W=cv.width, H=cv.height, ml=44, mr=14;
    ctx.clearRect(0,0,W,H);

    // ---- top strip: source distribution pdf ----
    var topY=8, topH=86;
    ctx.fillStyle='#333'; ctx.font="12px 'Courier New',monospace";
    ctx.fillText("source distribution (one draw)", ml, topY+12);
    var pr=s.prange, pw=W-ml-mr;
    // find pdf max
    var pmax=0; for(i=0;i<=120;i++){var xx=pr[0]+(pr[1]-pr[0])*i/120; pmax=Math.max(pmax,s.pdf(xx));}
    pmax=pmax||1;
    ctx.strokeStyle='#8a6d3b'; ctx.lineWidth=2; ctx.beginPath();
    for(i=0;i<=120;i++){
      var x=pr[0]+(pr[1]-pr[0])*i/120;
      var px=ml+pw*i/120, py=topY+24+ (topH-24) - (s.pdf(x)/pmax)*(topH-26);
      if(i===0)ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.stroke();
    // mean marker
    var mux=ml+pw*((s.mu-pr[0])/(pr[1]-pr[0]));
    ctx.strokeStyle='#bbb'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(mux,topY+22); ctx.lineTo(mux,topY+topH); ctx.stroke(); ctx.setLineDash([]);

    // ---- bottom: histogram of sample means ----
    var by=topH+34, bh=H-by-26;
    ctx.fillStyle='#333'; ctx.fillText("distribution of the sample mean ("+B+" samples, n="+n+")", ml, by-8);

    var lo=s.mu-4*se, hi=s.mu+4*se;
    // clamp to data extremes a touch
    for(i=0;i<B;i++){if(means[i]<lo)lo=means[i]; if(means[i]>hi)hi=means[i];}
    var nb=40, binw=(hi-lo)/nb, counts=new Array(nb).fill(0);
    for(i=0;i<B;i++){var b=Math.floor((means[i]-lo)/binw); if(b<0)b=0; if(b>=nb)b=nb-1; counts[b]++;}
    var cmax=0; for(i=0;i<nb;i++)cmax=Math.max(cmax,counts[i]);
    // overlay normal peak in counts
    var peak=normPdf(s.mu,s.mu,se)*B*binw; cmax=Math.max(cmax,peak);

    var pw2=W-ml-mr;
    function X(v){return ml+pw2*((v-lo)/(hi-lo));}
    function Y(c){return by+bh - (c/cmax)*bh;}
    // bars
    ctx.fillStyle='#9cc3e6';
    for(i=0;i<nb;i++){
      var x0=X(lo+i*binw), x1=X(lo+(i+1)*binw);
      ctx.fillRect(x0, Y(counts[i]), Math.max(1,x1-x0-1), by+bh-Y(counts[i]));
    }
    // normal overlay
    ctx.strokeStyle='#c0392b'; ctx.lineWidth=2; ctx.beginPath();
    for(i=0;i<=160;i++){
      var xv=lo+(hi-lo)*i/160, cc=normPdf(xv,s.mu,se)*B*binw;
      var X2=X(xv), Y2=Y(cc);
      if(i===0)ctx.moveTo(X2,Y2); else ctx.lineTo(X2,Y2);
    }
    ctx.stroke();
    // axis baseline + mean line + ticks
    ctx.strokeStyle='#ccc'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(ml,by+bh); ctx.lineTo(W-mr,by+bh); ctx.stroke();
    ctx.strokeStyle='#888'; ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(X(s.mu),by); ctx.lineTo(X(s.mu),by+bh); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#555'; ctx.font="11px 'Courier New',monospace";
    ctx.fillText("μ="+s.mu.toFixed(2), X(s.mu)+3, by+12);
    ctx.fillText(lo.toFixed(2), ml, by+bh+14);
    ctx.fillText(hi.toFixed(2), W-mr-30, by+bh+14);

    document.getElementById('note').textContent =
      (n<=2 ? "With n="+n+" the sample mean still looks like the source. "
            : "With n="+n+" the sample mean is already close to the red normal curve. ")
      + "The bell narrows as σ/√n: bigger samples give more precise means.";
  }

  document.getElementById('n').addEventListener('input',draw);
  document.getElementById('resample').addEventListener('click',draw);
  document.getElementById('seg').addEventListener('click',function(e){
    if(e.target.tagName!=='BUTTON')return;
    [].forEach.call(this.children,function(b){b.classList.remove('on');});
    e.target.classList.add('on'); dist=e.target.getAttribute('data-d'); draw();
  });
  draw();
})();
</script>
</body>
</html>
