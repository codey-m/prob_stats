<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Normal probabilities</title>
<style>
:root{color-scheme:dark;--bg:#12161d;--panel:#1a2029;--fg:#e7eaf0;--muted:#a6afbd;--rule:#68758b;--curve:#6aa8e8;--accent:#a892f0;--error:#f08a72;--shade:#29263b;--hatch:#8f82bd;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-size:16px;line-height:1.5;padding:20px max(16px,env(safe-area-inset-left,0px)) 22px}
.wrap{max-width:900px;margin:auto}
.distribution{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.1rem;font-weight:600;margin:0 0 3px}
.instruction{color:var(--muted);margin:0 0 16px}
fieldset{border:0;padding:0;margin:0}legend{padding:0}
.modes{display:flex;gap:7px;margin-bottom:18px}
.mode{display:flex;justify-content:center;align-items:center;gap:7px;flex:1;padding:9px 10px;border:1px solid var(--rule);border-radius:7px;background:var(--panel);cursor:pointer;white-space:nowrap}
.mode:has(input:checked){border-color:var(--accent);background:#27243a;box-shadow:inset 0 0 0 1px var(--accent)}
input[type=radio]{margin:0;accent-color:var(--accent);width:16px;height:16px;flex:none}
button,input{font:inherit;color:inherit}
input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.bounds{display:grid;gap:12px}
.bound{display:grid;grid-template-columns:8.4rem minmax(80px,1fr) 8.5rem;align-items:center;gap:12px}
.bound-label{font-weight:600}
input[type=range]{width:100%;min-width:0;accent-color:var(--accent);height:34px;margin:0}
input[type=number]{width:100%;min-width:0;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:8px 9px;font-variant-numeric:tabular-nums}
input[aria-invalid=true]{border-color:var(--error);outline-color:var(--error)}
[hidden]{display:none!important}
.range-note{font-size:12px;color:var(--muted);margin:6px 0 14px}
.error{color:var(--error);font-size:.94rem;margin:0 0 12px}.error:empty{display:none}
.plot{margin:0;background:var(--panel);border:1px solid #303947;border-radius:10px;padding:12px 10px 4px}
svg{display:block;width:100%;height:clamp(220px,32vw,280px);overflow:visible}
.readout{display:flex;justify-content:center;align-items:baseline;flex-wrap:wrap;gap:3px 9px;min-height:2.6rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(.95rem,3.1vw,1.12rem);font-variant-numeric:tabular-nums}
#event{overflow-wrap:anywhere;text-align:center;max-width:100%}
.result{font-size:1.75rem;color:var(--accent);font-weight:700;letter-spacing:.015em}
.formula{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;text-align:center;color:var(--muted);margin:1px 0 5px;overflow-wrap:anywhere}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:540px){body{padding:16px 14px 18px}.instruction{font-size:.94rem}.modes{gap:6px;margin-bottom:14px}.mode{padding:9px 6px;font-size:14px;gap:5px}.bound{grid-template-columns:minmax(0,1fr) 8.5rem;gap:3px 10px}.bound-label{grid-column:1;grid-row:1}.bound input[type=number]{grid-column:2;grid-row:1}.bound input[type=range]{grid-column:1/-1;grid-row:2}.bounds{gap:9px}.range-note{margin:3px 0 12px}.plot{padding:10px 8px 3px}.result{font-size:1.5rem}.formula{font-size:12px}}
</style>
</head>
<body>
<main class="wrap" aria-label="Standard normal probability lookup">
  <p class="distribution">Z ∼ N(0, 1)</p>
  <p class="instruction">Choose an area, then move or enter the cutoff.</p>
  <fieldset>
    <legend class="vh">Probability region</legend>
    <div class="modes">
      <label class="mode"><input type="radio" name="mode" value="left" checked>Left tail</label>
      <label class="mode"><input type="radio" name="mode" value="right">Right tail</label>
      <label class="mode"><input type="radio" name="mode" value="interval">Interval</label>
    </div>
  </fieldset>
  <div class="bounds">
    <div class="bound" id="lower-group" hidden>
      <label class="bound-label" id="lower-label" for="lower">Lower bound a</label>
      <input type="range" id="lower-slider" min="-6" max="6" step="0.01" value="-1.16" aria-labelledby="lower-label" aria-describedby="range-help">
      <input type="number" id="lower" min="-6" max="6" step="any" value="-1.16" aria-describedby="range-help error" autocomplete="off">
    </div>
    <div class="bound">
      <label class="bound-label" id="upper-label" for="upper">Cutoff z</label>
      <input type="range" id="upper-slider" min="-6" max="6" step="0.01" value="1.16" aria-labelledby="upper-label" aria-describedby="range-help">
      <input type="number" id="upper" min="-6" max="6" step="any" value="1.16" aria-describedby="range-help error" autocomplete="off">
    </div>
  </div>
  <p id="range-help" class="vh">Enter a number from minus 6 to 6. The slider moves in steps of 0.01; the number field accepts finer precision.</p>
  <p class="range-note">Cutoffs from −6 to 6. Type a value for precise lookup.</p>
  <p id="error" class="error"></p>
  <figure class="plot" aria-label="Normal density and selected area">
    <figcaption><div class="readout" id="readout"><span id="event"></span><span id="equals">=</span><span class="result" id="result"></span></div><p id="formula" class="formula"></p></figcaption>
    <svg id="plot" role="img" aria-labelledby="plot-title" aria-describedby="plot-desc"><title id="plot-title">Standard normal density</title><desc id="plot-desc"></desc></svg>
  </figure>
  <p id="status" class="vh" role="status" aria-live="polite" aria-atomic="true"></p>
</main>
<script>
(function(){
  'use strict';
  const INV_SQRT_2PI=1/Math.sqrt(2*Math.PI);
  function pdf(z){return typeof z!=='number'||Number.isNaN(z)?NaN:INV_SQRT_2PI*Math.exp(-0.5*z*z);}
  // Adaptive quadrature integrates a positive function, including in the tails.
  function integrate(f,a,b,tolerance){
    const middle=(a+b)/2,fa=f(a),fm=f(middle),fb=f(b),whole=(b-a)*(fa+4*fm+fb)/6;
    function refine(lo,hi,flo,fmid,fhi,estimate,eps,depth){
      const mid=(lo+hi)/2,lm=(lo+mid)/2,rm=(mid+hi)/2,flm=f(lm),frm=f(rm);
      const left=(mid-lo)*(flo+4*flm+fmid)/6,right=(hi-mid)*(fmid+4*frm+fhi)/6,delta=left+right-estimate;
      if(depth===0||Math.abs(delta)<=15*eps)return left+right+delta/15;
      return refine(lo,mid,flo,flm,fmid,left,eps/2,depth-1)+refine(mid,hi,fmid,frm,fhi,right,eps/2,depth-1);
    }
    return refine(a,b,fa,fm,fb,whole,tolerance,22);
  }
  function positiveTail(z){
    if(z===0)return 0.5;
    const density=pdf(z);if(density===0)return 0;
    return density*integrate(t=>Math.exp(-z*t-t*t/2),0,12,2e-14);
  }
  function cdf(z){if(typeof z!=='number'||Number.isNaN(z))return NaN;return z<0?positiveTail(-z):1-positiveTail(z);}
  function sf(z){if(typeof z!=='number'||Number.isNaN(z))return NaN;return z<0?1-positiveTail(-z):positiveTail(z);}
  function interval(a,b){
    if(typeof a!=='number'||typeof b!=='number'||Number.isNaN(a)||Number.isNaN(b)||a>b)return NaN;
    if(a===b)return 0;
    if(a===-Infinity)return cdf(b);if(b===Infinity)return sf(a);
    const peak=pdf(Math.max(a,Math.min(0,b)));
    return Math.max(0,Math.min(1,integrate(pdf,a,b,Math.max(Number.MIN_VALUE,peak*(b-a)*2e-14))));
  }
  function formatProbability(p){return Math.max(0,p).toFixed(4);}
  globalThis.NormalProbability=Object.freeze({pdf,cdf,sf,interval,formatProbability});
  if(typeof document==='undefined')return;
  const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
  let mode='left',current=null;
  function element(tag,attrs,text){const node=document.createElementNS(NS,tag);for(const [key,value]of Object.entries(attrs))node.setAttribute(key,value);if(text!==undefined)node.textContent=text;return node;}
  function display(value){return (Object.is(value,-0)?0:value).toString().replace('-','−');}
  function read(){
    const ids=mode==='interval'?['lower','upper']:['upper'];
    const values=ids.map(id=>{const input=$(id),raw=input.value.trim(),value=raw===''?NaN:Number(raw);return {id,value,valid:Number.isFinite(value)&&value>=-6&&value<=6};});
    for(const id of ['lower','upper'])$(id).removeAttribute('aria-invalid');
    const invalid=values.filter(item=>!item.valid);
    if(invalid.length){invalid.forEach(item=>$(item.id).setAttribute('aria-invalid','true'));return {error:'Enter a number from −6 to 6 in each box.'};}
    const b=values[values.length-1].value,a=mode==='interval'?values[0].value:-Infinity;
    if(a>b){$('lower').setAttribute('aria-invalid','true');$('upper').setAttribute('aria-invalid','true');return {error:'The lower bound a must be no greater than the upper bound b.'};}
    const p=mode==='left'?cdf(b):mode==='right'?sf(b):interval(a,b);
    const event=mode==='interval'?'P('+display(a)+' ≤ Z ≤ '+display(b)+')':'P(Z '+(mode==='left'?'≤':'≥')+' '+display(b)+')';
    const spoken=mode==='interval'?'Probability that Z is between '+a+' and '+b: 'Probability that Z is '+(mode==='left'?'at most ':'at least ')+b;
    const formula=mode==='left'?'Φ('+display(b)+')':mode==='right'?'1 − Φ('+display(b)+')':'Φ('+display(b)+') − Φ('+display(a)+')';
    return {a,b,p,event,spoken,formula};
  }
  function draw(){
    const svg=$('plot'),width=Math.max(250,svg.getBoundingClientRect().width),height=svg.getBoundingClientRect().height||280;
    svg.setAttribute('viewBox','0 0 '+width+' '+height);
    const pad=width<450?25:38,base=height-38,top=34,X=z=>pad+(z+6)/12*(width-2*pad),Y=d=>base-d/0.4*(base-top),nodes=[];
    const defs=element('defs',{}),pattern=element('pattern',{id:'area-hatch',width:8,height:8,patternUnits:'userSpaceOnUse'});
    pattern.append(element('rect',{width:8,height:8,fill:'var(--shade)'}),element('path',{d:'M-2,2L2,-2 M0,8L8,0 M6,10L10,6',stroke:'var(--hatch)','stroke-width':1}));defs.append(pattern);nodes.push(defs);
    nodes.push(element('text',{x:pad,y:18,fill:'var(--muted)','font-size':13},'Standard normal density'));
    if(current&&!current.error){
      const lo=mode==='left'?-6:mode==='right'?current.b:current.a,hi=mode==='right'?6:current.b;
      let area='M'+X(lo)+','+base;
      const n=Math.max(2,Math.ceil((hi-lo)*25));for(let i=0;i<=n;i++){const z=lo+(hi-lo)*i/n;area+='L'+X(z)+','+Y(pdf(z));}area+='L'+X(hi)+','+base+'Z';
      nodes.push(element('path',{d:area,fill:'url(#area-hatch)'}));
    }
    nodes.push(element('line',{x1:pad,y1:base,x2:width-pad,y2:base,stroke:'var(--muted)','stroke-width':1.5}));
    const tickStep=width<560?2:1;
    for(let z=-6;z<=6;z+=tickStep){nodes.push(element('line',{x1:X(z),y1:base,x2:X(z),y2:base+5,stroke:'var(--muted)','stroke-width':1.5}),element('text',{x:X(z),y:base+23,'text-anchor':'middle',fill:'var(--muted)','font-size':14},display(z)));}
    nodes.push(element('text',{x:width-pad,y:height-2,'text-anchor':'end',fill:'var(--muted)','font-size':14},'z'));
    let curve='';for(let i=0;i<=360;i++){const z=-6+i/30;curve+=(i?'L':'M')+X(z)+','+Y(pdf(z));}nodes.push(element('path',{d:curve,fill:'none',stroke:'var(--curve)','stroke-width':2.5}));
    if(current&&!current.error){
      const markers=mode==='interval'?[{z:current.a,lower:true},{z:current.b,lower:false}]:[{z:current.b,lower:false}];
      for(const marker of markers){const x=X(marker.z);nodes.push(element('line',{x1:x,y1:top-4,x2:x,y2:base,stroke:'var(--accent)','stroke-width':2,'stroke-dasharray':marker.lower?'5 4':'none'}));
        if(marker.lower)nodes.push(element('path',{d:'M'+(x-5)+','+(base+6)+'L'+x+','+(base-3)+'L'+(x+5)+','+(base+6)+'Z',fill:'var(--accent)'}));
        else nodes.push(element('circle',{cx:x,cy:base,r:4,fill:'var(--accent)'}));
      }
    }
    const title=$('plot-title'),description=$('plot-desc');svg.replaceChildren(title,description,...nodes);
  }
  function update(){
    current=read();$('error').textContent=current.error||'';
    $('event').textContent=current.error?'Enter valid bounds to calculate the probability.':current.event;
    $('equals').hidden=!!current.error;$('result').textContent=current.error?'':formatProbability(current.p);
    $('formula').textContent=current.error?'':current.formula;
    $('plot-desc').textContent=current.error?'A standard normal density. No region is selected until the bounds are valid.':current.spoken+' is '+formatProbability(current.p)+'. The selected area is hatched.';
    draw();
  }
  function announce(){$('status').textContent=current.error||current.spoken+' is '+formatProbability(current.p)+'.';}
  for(const id of ['lower','upper']){
    const input=$(id),slider=$(id+'-slider');
    input.addEventListener('input',()=>{const v=Number(input.value);if(input.value.trim()!==''&&Number.isFinite(v)&&v>=-6&&v<=6)slider.value=v;update();});
    input.addEventListener('change',announce);
    slider.addEventListener('input',()=>{input.value=slider.value;update();});
    slider.addEventListener('change',announce);
  }
  document.querySelectorAll('input[name=mode]').forEach(input=>input.addEventListener('change',()=>{mode=input.value;$('lower-group').hidden=mode!=='interval';$('upper-label').textContent=mode==='interval'?'Upper bound b':'Cutoff z';update();announce();}));
  if(typeof ResizeObserver!=='undefined')new ResizeObserver(draw).observe($('plot'));
  else window.addEventListener('resize',draw);
  update();
})();
</script>
</body>
</html>
